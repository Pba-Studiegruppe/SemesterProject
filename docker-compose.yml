services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/backend/AppHost/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: src/webui/WebUI/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data: